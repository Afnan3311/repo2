
apiVersion: apps/v1
kind: Deployment

metadata:
  name: aws-dashboard-deployment
  namespace: production
  labels:
    app: aws-dashboard
    tier: frontend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: aws-dashboard

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: aws-dashboard
        tier: frontend

    spec:
      containers:
        - name: aws-dashboard
          image:afnan2004/aws-dashboard:8
          imagePullPolicy: Always

          ports:
            - containerPort: 80
              protocol: TCP

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

      restartPolicy: Always


